    </head>
    <title>SignUp</title>
    <body>
        

        <div class="Register-container">

            <div class="TextContainer">
                <h1>Hello, Friend!</h1>
                <p>Make a positive impact on the local economy. Whether you're looking for fresh fruits, vegetables, or artisanal products, you'll find everything you need here.</p>
               <button onclick="LoginNavigator()">Login</button>
            </div>

            <div class="Register-Box">
                <h1 class="Title"><i class="fas fa-store"></i>Welcome To DMA-MARKET</h1>
                 <h2 >Create Account!</h2>



                <form action="" class="Register-Form">
                    
                    <div>
                    <label for="">UserName</label>
                    <input type="text" class="UserName" >
                     <div class="error"></div>
                    </div>
                    <div>
                        <label for="">Email</label>
                         <input type="email" class="Email" >
                         <div class="error"></div>

                    </div>
                    <div>
                        <label for="">Password</label>
                     <input type="password" class="Password" >
                     <div class="error"></div>


                    </div>
                    
                   
                    <button class="Submit">Create account</button>
                    </form>
                   
            </div>

       
        </div>



 <script src="Register.js">




        </script>
    </body>
</html>
